name: Fixture mutual TLS
on:
  push:
    branches: [main]
    paths: ["services/event-fabric/**", "deploy/compose/**", "tests/generate-lab-certs.sh", "tests/mtls-smoke.sh", "tests/execution-smoke.sh", ".github/workflows/mtls.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutual-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AETHER_OPERATOR_TOKEN: ci-disposable-operator-token-only
      AETHER_APPROVER_TOKEN: ci-disposable-approver-token-only
      AETHER_TLS_DIR: ${{ runner.temp }}/aether-tls
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/generate-lab-certs.sh
      - run: docker compose -f deploy/compose/events.yaml -f deploy/compose/mtls.yaml --profile workflow up -d --build
      - run: bash tests/event-fabric-smoke.sh
      - run: bash tests/mtls-smoke.sh
      - if: always()
        run: docker compose -f deploy/compose/events.yaml -f deploy/compose/mtls.yaml --profile workflow down -v
