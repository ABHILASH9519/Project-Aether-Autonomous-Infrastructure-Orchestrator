name: Configuration management
on:
  push:
    paths: ["automation/**", ".github/workflows/automation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aether-automation:ci automation
      - run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges aether-automation:ci
