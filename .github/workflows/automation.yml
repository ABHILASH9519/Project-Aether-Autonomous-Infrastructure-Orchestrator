name: Configuration management
on:
  push:
    paths: ["automation/**", "services/event-fabric/**", "deploy/compose/automation.yaml", "deploy/compose/events.yaml", "tests/execution-smoke.sh", ".github/workflows/automation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aether-automation:ci automation
      - run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges aether-automation:ci

  approved-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AETHER_OPERATOR_TOKEN: ci-disposable-operator-token-only
      AETHER_APPROVER_TOKEN: ci-disposable-approver-token-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/events.yaml -f deploy/compose/automation.yaml --profile workflow up -d --build
      - run: |
          for i in {1..60}; do
            if curl -fsS localhost:8081/healthz && curl -fsS localhost:8082/healthz; then break; fi
            sleep 2
          done
          bash tests/execution-smoke.sh
      - if: always()
        run: docker compose -f deploy/compose/events.yaml -f deploy/compose/automation.yaml --profile workflow logs
      - if: always()
        run: docker compose -f deploy/compose/events.yaml -f deploy/compose/automation.yaml --profile workflow down -v
