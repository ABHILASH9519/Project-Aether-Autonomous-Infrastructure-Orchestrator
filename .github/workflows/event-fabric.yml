name: Event fabric
on:
  push:
    paths: ["services/event-fabric/**", "deploy/compose/events.yaml", "tests/event-fabric-smoke.sh", "tests/workflow-smoke.sh", ".github/workflows/event-fabric.yml"]
  pull_request:
    paths: ["services/event-fabric/**", "deploy/compose/events.yaml", "tests/event-fabric-smoke.sh", "tests/workflow-smoke.sh", ".github/workflows/event-fabric.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AETHER_TEST_DATABASE_URL: postgres://aether:ci-only@localhost:5432/aether_test?sslmode=disable
    defaults:
      run:
        working-directory: services/event-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/event-fabric/go.mod
          cache: false
      - run: go test -mod=mod -race ./...
      - run: go vet -mod=mod ./...
      - run: go build -mod=mod ./cmd/...
  integration:
    runs-on: ubuntu-latest
    env:
      AETHER_OPERATOR_TOKEN: ci-disposable-operator-token-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/events.yaml --profile workflow up -d --build
      - run: bash tests/event-fabric-smoke.sh
      - run: bash tests/workflow-smoke.sh
      - if: always()
        run: docker compose -f deploy/compose/events.yaml --profile workflow logs
      - if: always()
        run: docker compose -f deploy/compose/events.yaml --profile workflow down -v
