name: Event fabric
on:
  push:
    paths: ["services/event-fabric/**", "deploy/compose/events.yaml", ".github/workflows/event-fabric.yml"]
  pull_request:
    paths: ["services/event-fabric/**", "deploy/compose/events.yaml", ".github/workflows/event-fabric.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/event-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/event-fabric/go.mod
          cache: false
      - run: go test -mod=mod -race ./...
      - run: go vet -mod=mod ./...
      - run: go build -mod=mod ./cmd/...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/events.yaml up -d --build
      - run: bash tests/event-fabric-smoke.sh
      - if: always()
        run: docker compose -f deploy/compose/events.yaml logs
      - if: always()
        run: docker compose -f deploy/compose/events.yaml down -v
