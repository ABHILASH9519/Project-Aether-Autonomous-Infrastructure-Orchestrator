name: Event fabric
on:
  push:
    paths: ["services/event-fabric/**", "deploy/compose/events.yaml", "tests/event-fabric-smoke.sh", "tests/kafka-replay-smoke.sh", "tests/workflow-smoke.sh", "tests/execution-smoke.sh", "tests/cloud-evidence-smoke.sh", "tests/postgres-restore-smoke.sh", "tests/policy-outage-smoke.sh", "tests/redis-outage-smoke.sh", "tests/observability-smoke.sh", "tests/tracing-smoke.sh", "deploy/observability/**", "deploy/policy/**", ".github/workflows/event-fabric.yml"]
  pull_request:
    paths: ["services/event-fabric/**", "deploy/compose/events.yaml", "tests/event-fabric-smoke.sh", "tests/kafka-replay-smoke.sh", "tests/workflow-smoke.sh", "tests/execution-smoke.sh", "tests/cloud-evidence-smoke.sh", "tests/postgres-restore-smoke.sh", "tests/policy-outage-smoke.sh", "tests/redis-outage-smoke.sh", "tests/observability-smoke.sh", "tests/tracing-smoke.sh", "deploy/observability/**", "deploy/policy/**", ".github/workflows/event-fabric.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AETHER_TEST_REDIS_ADDR: localhost:6379
      AETHER_TEST_DATABASE_URL: postgres://aether:ci-only@localhost:5432/aether_test?sslmode=disable
    defaults:
      run:
        working-directory: services/event-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/event-fabric/go.mod
          cache: false
      - run: go test -mod=mod -race ./...
      - run: go vet -mod=mod ./...
      - run: go build -mod=mod ./cmd/...
  integration:
    runs-on: ubuntu-latest
    env:
      AETHER_OPERATOR_TOKEN: ci-disposable-operator-token-only
      AETHER_APPROVER_TOKEN: ci-disposable-approver-token-only
      AETHER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      AETHER_EXECUTION_ID: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/events.yaml --profile workflow --profile observability --profile cloud up -d --build
      - run: docker run --rm -v "$PWD/deploy/policy:/policy:ro" openpolicyagent/opa:1.3.0 test /policy -v
      - run: bash tests/event-fabric-smoke.sh
      - run: bash tests/workflow-smoke.sh
      - run: bash tests/kafka-replay-smoke.sh
      - run: bash tests/execution-smoke.sh
      - run: bash tests/cloud-evidence-smoke.sh
      - run: bash tests/postgres-restore-smoke.sh
      - run: bash tests/policy-outage-smoke.sh
      - run: bash tests/redis-outage-smoke.sh
      - name: Verify alert firing and recovery rules
        run: docker run --rm --network none --entrypoint /bin/promtool -v "$PWD/deploy/observability:/rules:ro" prom/prometheus:v2.55.1 test rules /rules/alerts.test.yml
      - run: bash tests/observability-smoke.sh
      - run: bash tests/tracing-smoke.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/event-fabric/go.mod
          cache: false
      - name: Measure bounded HTTP load and verify projection
        working-directory: services/event-fabric
        run: |
          set -o pipefail
          go run ./cmd/loadtest -requests 40 -concurrency 4 | tee "$RUNNER_TEMP/aether-load.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-load-report
          path: ${{ runner.temp }}/aether-load.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f deploy/compose/events.yaml --profile workflow --profile observability --profile cloud logs
      - if: always()
        run: docker compose -f deploy/compose/events.yaml --profile workflow --profile observability --profile cloud down -v
