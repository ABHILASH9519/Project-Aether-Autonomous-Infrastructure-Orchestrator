name: Dependency remediation candidate
on:
  push:
    branches: [main]
    paths: [".github/workflows/dependency-remediation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: false
      - name: Resolve security-fixed dependency candidate
        working-directory: services/event-fabric
        run: |
          go get github.com/klauspost/compress@v1.18.7 go.opentelemetry.io/otel@v1.44.0 go.opentelemetry.io/otel/sdk@v1.44.0 go.opentelemetry.io/otel/trace@v1.44.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.44.0 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 google.golang.org/grpc@v1.83.2
          go mod tidy
          go mod verify
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          go build -mod=readonly ./cmd/...
          echo 'BEGIN AETHER GO.MOD'
          cat go.mod
          echo 'END AETHER GO.MOD'
          echo 'BEGIN AETHER GO.SUM'
          cat go.sum
          echo 'END AETHER GO.SUM'
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-candidate
          path: |
            services/event-fabric/go.mod
            services/event-fabric/go.sum
