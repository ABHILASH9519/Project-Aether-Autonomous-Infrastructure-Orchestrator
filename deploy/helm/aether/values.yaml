image:
  repository: aether-event-fabric
  tag: local
  pullPolicy: Never
existingSecret: aether-local
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# Local dynamic provisioning; use a fresh namespace when changing storage mode.
persistence:
  enabled: true
  storageClassName: ""
  postgresSize: 2Gi
  kafkaSize: 2Gi
