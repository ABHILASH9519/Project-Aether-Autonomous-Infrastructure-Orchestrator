image:
  repository: aether-event-fabric
  tag: local
  digest: "" # Optional sha256 digest takes precedence over tag
  pullPolicy: Never
existingSecret: aether-local
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# Local dynamic provisioning; use a fresh namespace when changing storage mode.
persistence:
  enabled: true
  storageClassName: ""
  postgresSize: 2Gi
  kafkaSize: 2Gi

# Requires a NetworkPolicy-capable CNI; verified separately in kind CI.
networkPolicy:
  enabled: true

# Application replicas; the fixture and infrastructure remain single-instance.
replicas:
  ingest: 1
  consumer: 1
  relay: 1
  workflow: 1
  executor: 1

postgres:
  # Set false only when an externally provisioned PostgreSQL service is ready.
  bundled: true
