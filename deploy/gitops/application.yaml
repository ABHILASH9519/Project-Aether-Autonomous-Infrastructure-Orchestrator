# Local cluster only. Create the target namespace and Secret; load the image first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aether-local
  namespace: argocd
spec:
  project: aether-lab
  source:
    repoURL: https://github.com/ABHILASH9519/Project-Aether-Autonomous-Infrastructure-Orchestrator.git
    targetRevision: main
    path: deploy/helm/aether
    helm:
      releaseName: aether
  destination:
    server: https://kubernetes.default.svc
    namespace: aether
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
