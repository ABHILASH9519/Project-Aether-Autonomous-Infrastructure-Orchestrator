services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: aether
    volumes:
      - incident-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka:3.9.1
    user: "1000:1000"
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
  topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in aether.events.v1 aether.events.dlq.v1 aether.incidents.observed.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
  ingest:
    build:
      context: ../../services/event-fabric
    environment:
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
  consumer:
    build:
      context: ../../services/event-fabric
    entrypoint: ["/consumer"]
    environment:
      DATABASE_URL: postgres://aether:local-dev-only@postgres:5432/aether?sslmode=disable
      KAFKA_BROKERS: kafka:29092
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
  relay:
    build:
      context: ../../services/event-fabric
    entrypoint: ["/relay"]
    environment:
      DATABASE_URL: postgres://aether:local-dev-only@postgres:5432/aether?sslmode=disable
      KAFKA_BROKERS: kafka:29092
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
  opa:
    profiles: ["workflow"]
    image: openpolicyagent/opa:1.3.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/workflow.rego"]
    volumes:
      - ../policy:/policy:ro
  workflow:
    profiles: ["workflow"]
    build:
      context: ../../services/event-fabric
    entrypoint: ["/workflow"]
    environment:
      DATABASE_URL: postgres://aether:local-dev-only@postgres:5432/aether?sslmode=disable
      AETHER_OPERATOR_TOKEN: ${AETHER_OPERATOR_TOKEN:-}
      AETHER_APPROVER_TOKEN: ${AETHER_APPROVER_TOKEN:-}
      OPA_URL: http://opa:8181
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      opa:
        condition: service_started
      postgres:
        condition: service_healthy
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - ingest
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
volumes:
  kafka-data:
  incident-data:
