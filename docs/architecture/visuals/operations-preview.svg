<svg xmlns="http://www.w3.org/2000/svg" width="960" height="675" viewBox="0 0 960 675" role="img" aria-label="Illustrative HTTP and queue monitoring charts"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8197b5"/></marker></defs><rect width="960" height="675" rx="14" fill="#0b1526"/><g font-family="system-ui, sans-serif"><text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f5f9">AETHER / OPERATIONS METRICS</text><text x="480" y="55" text-anchor="middle" font-size="13" font-weight="650" fill="#fbbf24">ILLUSTRATIVE PREVIEW — synthetic curves, not measured runtime data</text><rect x="25" y="78" width="445" height="132" rx="8" fill="#14243b" stroke="#334866"/><text x="247" y="101" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Request throughput</text><text x="247" y="119" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">requests / second</text><g transform="translate(47,125) scale(2,0.92)"><path d="M0 20H200" stroke="#334866"/><path d="M0 45H200" stroke="#334866"/><path d="M0 70H200" stroke="#334866"/><polyline points="0,72 25,72 50,50 75,55 100,25 125,40 150,20 175,38 200,22" stroke="#34d399" fill="none" stroke-width="1.5"/></g><rect x="490" y="78" width="445" height="132" rx="8" fill="#14243b" stroke="#334866"/><text x="712" y="101" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Server errors</text><text x="712" y="119" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">errors / second</text><g transform="translate(512,125) scale(2,0.92)"><path d="M0 20H200" stroke="#334866"/><path d="M0 45H200" stroke="#334866"/><path d="M0 70H200" stroke="#334866"/><polyline points="0,80 25,80 50,80 75,40 100,80 125,80 150,54 175,80 200,80" stroke="#fb7185" fill="none" stroke-width="1.5"/></g><rect x="25" y="224" width="445" height="132" rx="8" fill="#14243b" stroke="#334866"/><text x="247" y="247"