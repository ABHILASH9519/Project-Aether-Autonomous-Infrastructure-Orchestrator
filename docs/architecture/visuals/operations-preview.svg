onds</text><g transform="translate(512,417) scale(2,0.92)"><path d="M0 20H200" stroke="#334866"/><path d="M0 45H200" stroke="#334866"/><path d="M0 70H200" stroke="#334866"/><polyline points="0,65 25,55 50,30 75,10 100,55 125,60 150,65 175,65 200,65" stroke="#fbbf24" fill="none" stroke-width="1.5"/></g><rect x="25" y="516" width="445" height="132" rx="8" fill="#14243b" stroke="#334866"/><text x="247" y="539" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Pending remediation jobs</text><text x="247" y="557" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">jobs</text><g transform="translate(47,563) scale(2,0.92)"><path d="M0 20H200" stroke="#334866"/><path d="M0 45H200" stroke="#334866"/><path d="M0 70H200" stroke="#334866"/><polyline points="0,65 25,65 50,20 75,20 100,40 125,65 150,65 175,65 200,65" stroke="#c084fc" fill="none" stroke-width="1.5"/></g><rect x="490" y="516" width="445" height="132" rx="8" fill="#14243b" stroke="#334866"/><text x="712" y="539" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Failed remediation jobs</text><text x="712" y="557" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">historical count</text><g transform="translate(512,563) scale(2,0.92)"><path d="M0 20H200" stroke="#334866"/><path d="M0 45H200" stroke="#334866"/><path d="M0 70H200" stroke="#334866"/><polyline points="0,65 25,65 50,65 75,40 100,40 125,40 150,40 175,40 200,40" stroke="#fb7185" fill="none" stroke-width="1.5"/></g></g></svg>