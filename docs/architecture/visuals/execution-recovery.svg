<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img" aria-label="Approved execution and retry flow"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8197b5"/></marker></defs><rect width="960" height="625" rx="14" fill="#0b1526"/><g font-family="system-ui, sans-serif"><text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f5f9">AETHER / EXECUTION AND RECOVERY</text><rect x="260" y="60" width="440" height="60" rx="9" fill="#14243b" stroke="#60a5fa" stroke-width="1.4"/><text x="480" y="85" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Approved incident</text><text x="480" y="105" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">OPA + version gate</text><path d="M480 120V144" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="260" y="144" width="440" height="60" rx="9" fill="#14243b" stroke="#60a5fa" stroke-width="1.4"/><text x="480" y="169" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Durable job</text><text x="480" y="189" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">Atomic state + queue</text><path d="M480 204V228" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="260" y="228" width="440" height="60" rx="9" fill="#14243b" stroke="#60a5fa" stroke-width="1.4"/><text x="480" y="253" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Go executor</text><text x="480" y="273" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">SKIP LOCKED / retries</text><path d="M480 288V312" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="260" y="312" width="440" height="60" rx="9" fill="#14243b" stroke="#60a5fa" stroke-width="1.4"/><text x="480" y="337" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Isolated adapter</text><text x="480" y="357" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">Fixed repair</text><path d="M480 372V396" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="260" y="396" width="440" height="60" rx="9" fill="#14243b" stroke="#60a5fa" stroke-width="1.4"/><text x="480" y="421" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Independent verification</text><text x="480" y="441" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">Read desired contents</text><path d="M480 456V480H245V500" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M480 456V480H715V500" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="500" width="410" height="66" rx="9" fill="#14243b" stroke="#34d399" stroke-width="1.4"/><text x="245" y="525" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Verified → resolved</text><text x="245" y="545" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">Persist evidence + audit</text><rect x="510" y="500" width="410" height="66" rx="9" fill="#14243b" stroke="#fb7185" stroke-width="1.4"/><text x="715" y="525" text-anchor="middle" font-size="16" font-weight="650" fill="#f1f5f9">Failure → retry or failed</text><text x="715" y="545" text-anchor="middle" font-size="12" font-weight="400" fill="#b5c5da">At most 3 recorded attempts</text><path d="M920 533H939V258H700" fill="none" stroke="#8197b5" stroke-width="1.8" marker-end="url(#arrow)"/><text x="480" y="601" text-anchor="middle" font-size="13" font-weight="400" fill="#b5c5da">External effects may replay after a crash; adapters must be idempotent.</text></g></svg>